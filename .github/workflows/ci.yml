name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy pytest pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy task_scheduler helpers --ignore-missing-imports || true
      - name: Ensure runtime dirs
        run: mkdir -p logs data
      - name: Tests
        run: pytest -m "not slow" --ignore=tests/test_basic_functionality.py --cov=task_scheduler --cov-report=term-missing -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
